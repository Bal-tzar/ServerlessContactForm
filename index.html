<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap for styling -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Contact Form</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" required />
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" name="email" required />
            </div>

            <div class="form-group">
                <label for="msg">Message:</label>
                <textarea class="form-control" id="msg" name="msg" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <div class="mt-3" id="response"></div>
    </div>

    <script>
        const ApiUrl = "https://6immv8alsf.execute-api.eu-west-1.amazonaws.com/prod/contact";

        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                msg: document.getElementById("msg").value
            };

            fetch(ApiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("response").innerHTML = 
                    `<div class="alert alert-success">Form submitted successfully!</div>`;
                document.getElementById("contactForm").reset();
            })
            .catch(error => {
                document.getElementById("response").innerHTML = 
                    `<div class="alert alert-danger">Submission failed: ${error}</div>`;
            });
        });
    </script>
</body>
</html>
